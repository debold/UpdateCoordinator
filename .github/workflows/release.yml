name: Release

# A tag release/vX.Y.Z builds both MSIs with version X.Y.Z after build and tests and publishes them as a GitHub release.
# Versions below 1.0.0 and versions with a suffix (e.g. 0.2.0-rc.1) are published as pre-releases.
on:
  push:
    tags: [ 'release/v*' ]

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring('release/v'.Length)
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Invalid version '$version' in tag." }
          $prerelease = $version.StartsWith('0.') -or $version.Contains('-')
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Build and test
        run: |
          dotnet build UpdateCoordinator.slnx -c Release
          dotnet test --solution UpdateCoordinator.slnx -c Release --no-build

      - name: Build installers
        shell: pwsh
        run: ./build/Build-Installers.ps1 -AgentVersion ${{ steps.version.outputs.version }} -ServerVersion ${{ steps.version.outputs.version }} -OutputDirectory artifacts/release

      - name: Versioned file names and checksums
        shell: pwsh
        run: |
          # Versioned names, so a browser never renames a second download (e.g. "UpdateCoordinator.Server (1).msi").
          foreach ($name in "Agent", "Server") {
            Move-Item "artifacts/release/UpdateCoordinator.$name.msi" "artifacts/release/UpdateCoordinator.$name-${{ steps.version.outputs.version }}.msi"
          }
          Get-ChildItem artifacts/release/*.msi | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } |
            Set-Content artifacts/release/SHA256SUMS.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @('release', 'create', '${{ github.ref_name }}', 'artifacts/release/UpdateCoordinator.Agent-${{ steps.version.outputs.version }}.msi', 'artifacts/release/UpdateCoordinator.Server-${{ steps.version.outputs.version }}.msi', 'artifacts/release/SHA256SUMS.txt',
            '--title', 'UpdateCoordinator ${{ steps.version.outputs.version }}', '--notes', 'Unsigned test build. See CHANGELOG.md and docs/admin/test-guide.md.')
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $arguments += '--prerelease' }
          gh @arguments
